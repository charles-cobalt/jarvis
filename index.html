<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS"><title>JARVIS</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="stylesheet" href="fonts.css">
<script>(function(){try{var t=localStorage.getItem("jarvis.theme")||"auto";var d=t==="day"||(t==="auto"&&matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.classList.toggle("day",d);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?"#ededed":"#121212"}catch(e){}})()</script>
<style>
:root{--line:#353535;--tx:#ececec;--mu:#8c8c8c;--grad-card:linear-gradient(180deg,#1c1c1c,#121212);--grad-hi:linear-gradient(180deg,#e2e2e2,#cfcfcf);--grad-mid:linear-gradient(180deg,#2c2c2c,#242424)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0}
html.day{filter:invert(1) hue-rotate(180deg)}html.day svg.keep{filter:none}
html,body{margin:0;min-height:100%;color:var(--tx);font:14px DINish,-apple-system,system-ui,sans-serif;overscroll-behavior:none;background:#000;background-image:linear-gradient(180deg,#262626 0%,#1c1c1c 12%,#121212 35%,#0d0d0d 60%,#080808 85%,#000 100%);background-attachment:fixed;background-repeat:no-repeat}
button{all:unset;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#262626 0%,#1c1c1c 12%,#121212 35%,#0d0d0d 60%,#080808 85%,#000 100%);opacity:0;animation:introIn .9s ease .1s forwards,introOut 1s ease 2.4s forwards}
#intro .mark{width:min(14.5vw,56px);height:auto;display:block}
#intro p{margin:14px 0 0;color:var(--mu);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
@keyframes introIn{to{opacity:1}}@keyframes introOut{from{opacity:1}to{opacity:0;visibility:hidden}}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 90px);opacity:0;animation:appIn 1.1s ease 2.5s forwards}
@keyframes appIn{to{opacity:1}}
.hd{display:flex;align-items:center;justify-content:center;margin:2px 0 6px}.hd .logo{display:block;padding:6px 16px}.hd .logo:focus-visible{outline:1px solid #666}.hlogo{width:31px;height:auto;display:block}
h1{font-size:21px;margin:6px 2px 2px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h2{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:20px 2px 8px}
.sub{color:var(--mu);font-size:12px;margin:0 2px 14px;min-height:15px}
.bar{height:1px;background:#2a2a2a;margin:0 2px 12px;position:relative}.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--grad-hi);width:0;transition:width .5s ease}
.card{background:var(--grad-card);border:1px solid var(--line);padding:0 14px;margin-bottom:8px}
ul{list-style:none;margin:0;padding:0}
li.card{display:flex;align-items:center;gap:12px;min-height:52px;animation:fi .5s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.ck{width:20px;height:28px;flex:none;display:flex;align-items:center;justify-content:center}
.ck:before{content:"";width:18px;height:18px;border:1px solid #5a5a5a;display:block}
.ck svg{display:none;width:12px;height:auto}
li.done .ck:before{display:none}li.done .ck svg{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li.done .t{color:var(--mu)}
li .t input{width:100%}
.ic{width:34px;height:44px;flex:none;color:#6a6a6a;display:flex;align-items:center;justify-content:center}.ic:active{color:#f2f2f2}.ic svg{width:18px;height:18px}
.add{display:flex;align-items:center;gap:6px;margin-top:12px}
input{width:100%;background:#141414;border:1px solid #333;color:var(--tx);padding:12px;font:inherit;outline:none;-webkit-appearance:none}input:focus{border-color:#8c8c8c}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.row{display:flex;gap:8px}.row>*{flex:1}.chip{flex:1;text-align:center;background:var(--grad-mid);border:1px solid #3a3a3a;color:#d8d8d8;padding:11px 8px}.chip.on{background:var(--grad-hi);border-color:#d8d8d8;color:#111;font-weight:700}
.lnk{color:var(--mu);padding:12px 4px;display:inline-block;font-size:13px;letter-spacing:.02em}.lnk:active{color:var(--tx)}
.btn{display:block;text-align:center;background:var(--grad-hi);color:#111;border:1px solid #d8d8d8;padding:13px 16px;font-weight:700;letter-spacing:.02em;margin-top:10px}
.btn.sec{background:var(--grad-mid);color:#e6e6e6;border:1px solid #3a3a3a;font-weight:600}
.card.p{padding:14px}.mu{color:var(--mu);font-size:12px}.msg{color:var(--mu);font-size:12px;margin:8px 2px;min-height:15px}
label.f{display:block;color:var(--mu);font-size:12px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.stat{background:var(--grad-card);border:1px solid var(--line);padding:12px 10px;text-align:center}.stat b{display:block;font-size:22px;font-weight:600}.stat span{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.mn{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.mn .ic{width:44px}.mn div{text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.ch{display:block;width:100%;height:auto}.dn{display:flex;align-items:center;gap:18px;padding:14px}.dn svg{width:112px;height:112px;flex:none}.dn b{display:block;font-size:20px;font-weight:600}.dn span{color:var(--mu);font-size:12px}
.an{padding:10px 14px}.an .r1{display:flex;justify-content:space-between;gap:10px}.an .r1 div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.an .r1 div:last-child{flex:none;font-weight:600}.an .mu{margin-top:4px}.pb{height:3px;background:#2a2a2a;margin-top:8px}.pb i{display:block;height:3px;background:var(--grad-hi)}
.dg{display:grid;gap:10px 6px;padding:14px}.dg div{text-align:center}.dg svg{width:100%;height:auto;display:block}.dg span{display:block;color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
nav{z-index:10;position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1a1a1af0,#0a0a0af5);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 calc(env(safe-area-inset-bottom) + 8px)}
nav button{color:#6a6a6a;display:flex;align-items:center;justify-content:center;min-width:64px;min-height:44px}nav button.on{color:#f2f2f2}nav svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){#intro{animation:introOut .01s 1s forwards;opacity:1}#app{animation:appIn .01s 1s forwards}}
</style></head><body>

else if(sMode==='month'){const wk=[];days.forEach((d,i)=>{const k=Math.floor((i+((days[0].getDay()+6)%7))/7);wk[k]=wk[k]||{d:0,g:0,l:'W'+(k+1)};wk[k].d+=per[i];wk[k].g+=n});charts='<h2>Daily progress</h2>'+chart(dayBars.map((b,i)=>({...b,l:b.l})),5).replace(/(<text[^>]*>)(\d+)(<\/text>)/g,'$1$2$3')+'<h2>Weekly progress</h2>'+chart(wk,1)}
else if(sMode==='year'){const mb=MN.map((x,i)=>({l:x.slice(0,3),d:0,g:0}));days.forEach((d,i)=>{mb[d.getMonth()].d+=per[i];mb[d.getMonth()].g+=n});charts='<h2>Monthly progress</h2>'+chart(mb,1)}
const pc=ds=>n&&ds.length?Math.round(100*ds.reduce((a,d)=>a+cnt(d),0)/(n*ds.length)):0;
const wkDays=d=>{const s=monOf(d);return rng(s,addDays(s,6))},moDays=d=>rng(new Date(d.getFullYear(),d.getMonth(),1,12),new Date(d.getFullYear(),d.getMonth()+1,0,12)),yrDays=d=>rng(new Date(d.getFullYear(),0,1,12),new Date(d.getFullYear(),11,31,12));
let dn='';
if(sMode==='day')dn='<h2>Progress by period</h2>'+dgrid(4,sd(pc([sAt]),'Day')+sd(pc(wkDays(sAt)),'Week')+sd(pc(moDays(sAt)),'Month')+sd(pc(yrDays(sAt)),'Year'));
else if(sMode==='week')dn='<h2>Daily donuts</h2>'+dgrid(7,days.map((d,i)=>sd(pc([d]),['M','T','W','T','F','S','S'][i])).join(''))+'<h2>Year</h2>'+dgrid(4,sd(pc(yrDays(sAt)),'Year '+y));
else if(sMode==='month'){const off=(days[0].getDay()+6)%7;dn='<h2>Daily donuts</h2>'+dgrid(7,'<div></div>'.repeat(off)+days.map(d=>sd(pc([d]),d.getDate())).join(''))+'<h2>Weekly donuts</h2>'+dgrid(5,(()=>{const ws=[];days.forEach((d,i)=>{const k=Math.floor((i+off)/7);(ws[k]=ws[k]||[]).push(d)});return ws.map((w,k)=>sd(pc(w),'W'+(k+1))).join('')})())+'<h2>Year</h2>'+dgrid(4,sd(pc(yrDays(sAt)),'Year '+y))}
else dn='<h2>Monthly donuts</h2>'+dgrid(4,MN.map((x,i)=>sd(pc(moDays(new Date(y,i,1,12))),x.slice(0,3))).join(''));
const keys=new Set(days.map(dk));
const an=items.map(it=>{const a=(it.days||[]).filter(k=>keys.has(k)).length,g=days.length,p=Math.round(100*a/g);return '<div class="card an"><div class="r1"><div>'+esc(it.name)+'</div><div>'+p+'%</div></div><div class="pb"><i style="width:'+p+'%"></i></div><div class="mu">Goal '+g+' &middot; Actual '+a+' &middot; Left '+(g-a)+'</div></div>'}).join('');
body='<h2>Overall progress</h2><div class="card dn">'+don+'<div><b>'+comp+'/'+goal+'</b><span>completed</span></div></div><div class="st3"><div><h2 style="margin-top:12px">Goal</h2><div class="stat"><b>'+goal+'</b></div></div><div><h2 style="margin-top:12px">Completed</h2><div class="stat"><b>'+comp+'</b></div></div><div><h2 style="margin-top:12px">Left</h2><div class="stat"><b>'+left+'</b></div></div></div>'+charts+dn+'<h2>Analysis</h2>'+an}
v.innerHTML=head+body;
v.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{sMode=b.dataset.sm;drawStats()});
const step=s=>{if(sMode==='day')sAt=addDays(sAt,s);else if(sMode==='week')sAt=addDays(sAt,7*s);else if(sMode==='month')sAt=new Date(y,m+s,1,12);else sAt=new Date(y+s,0,1,12);drawStats()};
$('#pm').onclick=()=>step(-1);$('#nm').onclick=()=>step(1)}
function drawSettings(){const th=theme(),v=$('#view');
let acct;
if(user){acct=`<div class="card p"><div>${esc(user.email)}</div><div class="mu" style="margin-top:4px">${user.emailVerified?'Email verified. Synced across your devices.':'Email not verified yet. Check your inbox. Synced across your devices.'}</div>${user.emailVerified?'':'<button class="lnk" id="resend">Resend verification email</button><br>'}<button class="lnk" id="out">Sign out</button></div>`}
else{acct=`<div class="card p"><div class="mu" style="margin-bottom:4px">Signed out. Your list is saved on this device only.</div><label class="f">Email</label><input id="em" type="email" autocomplete="email" autocapitalize="off" spellcheck="false"><label class="f">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin-top:10px"><button class="btn go" data-a="in" style="margin-top:0">Sign in</button><button class="btn sec go" data-a="up" style="margin-top:0">Create account</button></div><div class="row" style="margin-top:10px"><button class="btn sec go" data-a="reset" style="margin-top:0">Forgot password</button></div></div>`}
v.innerHTML=`<h1>Settings</h1><h2>Theme</h2><div class="row">${['night','day','auto'].map(k=>`<button class="chip ${th===k?'on':''}" data-th="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><h2>Account</h2>${acct}<div class="msg" id="msg">${esc(msg)}</div><h2>Backup</h2><div class="card p"><div class="mu">Export your list as a file, or load one back in.</div><div class="row" style="margin-top:10px"><button class="btn sec" id="exp" style="flex:1;margin-top:0">Export</button><button class="btn sec" id="imp" style="flex:1;margin-top:0">Import</button></div><input type="file" id="file" accept="application/json" hidden></div>`;
v.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{localStorage.setItem('jarvis.theme',b.dataset.th);applyTheme();draw()});
v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;msg='';draw()});
v.querySelectorAll('.go').forEach(go=>go.onclick=async()=>{const a=go.dataset.a,em=$('#em').value.trim(),pw=$('#pw')?$('#pw').value:'';msg='';
try{if(a==='reset'){await sendPasswordResetEmail(auth,em);msg='Reset link sent if that email has an account.'}
else if(a==='up'){const c=await createUserWithEmailAndPassword(auth,em,pw);try{await sendEmailVerification(c.user);msg='Account created. Verification email sent.'}catch(e){}}
else await signInWithEmailAndPassword(auth,em,pw)}catch(e){msg=({'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'That email already has an account.','auth/weak-password':'Password needs at least 6 characters.','auth/invalid-email':'That email does not look right.','auth/missing-password':'Enter a password.'})[e.code]||('Could not complete: '+e.code)}draw()});
const out=$('#out');if(out)out.onclick=()=>signOut(auth);
const rs=$('#resend');if(rs)rs.onclick=async()=>{try{await sendEmailVerification(user);msg='Verification email sent.'}catch(e){msg='Try again in a minute.'}draw()};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'jarvis',exported:new Date().toISOString(),items},null,2)],{type:'application/json'}));a.download='jarvis-backup.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(Array.isArray(j.items)){items=j.items.filter(x=>x&&x.name).map(x=>({name:String(x.name).slice(0,80),days:Array.isArray(x.days)?x.days:[]}));persist();msg='Backup loaded.'}else msg='That file is not a Jarvis backup.'}catch(er){msg='That file could not be read.'}draw()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.go;editing=-1;draw()});
$('#home').onclick=()=>{page='today';editing=-1;draw();scrollTo(0,0)};
matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme);
onAuthStateChanged(auth,u=>{user=u;if(unsub){unsub();unsub=null}
 if(u){let first=true;unsub=onSnapshot(doc(db,'users',u.uid),s=>{const cloud=s.exists()?(s.data().items||[]):null;
  if(first){first=false;
   if(cloud===null){persist()}
   else{const names=new Set(cloud.map(x=>x.name));const extra=items.filter(x=>!names.has(x.name));items=cloud.concat(extra);if(extra.length)persist();else localStorage.setItem(K,JSON.stringify(items))}}
  else if(cloud&&!s.metadata.hasPendingWrites){items=cloud;localStorage.setItem(K,JSON.stringify(items))}
  if(editing<0)draw()},e=>{msg='Sync unavailable: '+e.code;draw()})}
 draw()});
applyTheme();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

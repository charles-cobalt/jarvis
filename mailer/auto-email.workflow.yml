name: auto-email
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd mailer && npm install --no-audit --no-fund
      - run: node mailer/send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAIL_CODE_SALT: ${{ secrets.MAIL_CODE_SALT }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
      - name: keep-alive (scheduled workflows pause after 60 days without repo activity)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ "$(date +%d)" = "01" ] && [ "$(date +%H)" = "08" ]; then curl -s -o /dev/null -H "api-key: $BREVO_API_KEY" https://api.brevo.com/v3/account; fi
          if [ "$(date +%d)" = "01" ] && [ "$(date +%H)" = "08" ]; then
            git config user.name "jarvis-keepalive"; git config user.email "jarvis3000@mail.instinct.com"
            date -u +%FT%TZ > mailer/.keepalive; git add mailer/.keepalive; git commit -m "keep-alive" && git push || true
          fi
